[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-agent-trading-desk"
version = "0.5.3"
description = "Domain-specific Agent Harness for auditable, analysis-only A-share trading workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Lolalola3"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
a-share-desk = "trading_desk.cli:main"
a-share-desk-mcp = "trading_desk.mcp_server:serve"

[tool.setuptools.packages.find]
include = ["trading_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
